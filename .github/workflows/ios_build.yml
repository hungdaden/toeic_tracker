name: Build iOS IPA

on:
  workflow_dispatch: # Chỉ chạy khi người dùng bấm nút Build thủ công trên GitHub

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.7'
          cache: true

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Create assets directory and .env file
        run: |
          mkdir -p assets
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > assets/.env

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS App with Xcode (Unsigned Sideload)
        run: |
          flutter build ios --config-only --release --no-codesign
          xcodebuild build \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package IPA (Sideload Ready)
        run: |
          mkdir -p build/ios/iphoneos
          APP_PATH=$(find build -name "Runner.app" -type d -path "*/Release-iphoneos/*" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          fi
          echo "Found Runner.app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: Runner.app not found!"
            exit 1
          fi
          cp -r "$APP_PATH" build/ios/iphoneos/Runner.app
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r MunAI_Tracker.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MunAI_iOS_Build
          path: build/ios/iphoneos/MunAI_Tracker.ipa
